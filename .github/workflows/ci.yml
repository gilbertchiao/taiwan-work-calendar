name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安裝 uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: 安裝相依（鎖定版本）
        run: uv sync --locked

      - name: Lint（ruff）
        run: uv run --locked ruff check .

      - name: 格式檢查（ruff format）
        run: uv run --locked ruff format --check .

      - name: 單元測試
        run: uv run --locked pytest

      - name: 驗證 data/ JSON 符合 schema
        run: uv run --locked python scripts/validate_data.py data
